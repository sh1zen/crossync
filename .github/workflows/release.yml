name: Create Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (for example v0.2.1)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Validate release tag
        run: |
          case "$RELEASE_TAG" in
            v*.*.*) ;;
            *) echo "Expected a release tag like v0.2.1" >&2; exit 1 ;;
          esac
          git show-ref --verify "refs/tags/$RELEASE_TAG"
      - name: Create source archives
        run: |
          git archive --format=zip --prefix="crossync-${RELEASE_TAG}/" \
            --output="$RUNNER_TEMP/source-${RELEASE_TAG}.zip" HEAD
          git archive --format=tar.gz --prefix="crossync-${RELEASE_TAG}/" \
            --output="$RUNNER_TEMP/source-${RELEASE_TAG}.tar.gz" HEAD
      - name: Prepare release notes
        run: |
          if [ -f CHANGELOG.md ]; then
            cp CHANGELOG.md "$RUNNER_TEMP/RELEASE_BODY.md"
          else
            {
              echo "## Release ${RELEASE_TAG}"
              echo ""
              echo "**Repository:** [${GITHUB_REPOSITORY}](https://github.com/${GITHUB_REPOSITORY})"
              echo "**Commit:** [$(git rev-parse HEAD)](https://github.com/${GITHUB_REPOSITORY}/commit/$(git rev-parse HEAD))"
              echo "**Author:** ${GITHUB_ACTOR}"
              echo "**Date:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
              echo ""
              echo "This release was automatically generated by GitHub Actions"
            } > "$RUNNER_TEMP/RELEASE_BODY.md"
          fi
      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "$RELEASE_TAG" \
              --notes-file "$RUNNER_TEMP/RELEASE_BODY.md" \
              --draft \
              --prerelease
          fi
          gh release upload "$RELEASE_TAG" \
            "$RUNNER_TEMP/source-${RELEASE_TAG}.zip" \
            "$RUNNER_TEMP/source-${RELEASE_TAG}.tar.gz" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
      - name: Summary
        run: |
          echo "Release assets uploaded: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}" >> "$GITHUB_STEP_SUMMARY"
